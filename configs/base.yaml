# Base hyper-parameters for the Clause86 5-seed protocol.
# Override per-dataset via configs/<dataset>.yaml.

tm:
 n_clauses: 400
 T: 200
 s: 10.0
 depth: 2
 n_epochs: 25
 seeds: [42, 123, 456, 789, 1337]
 allow_fallback: false

recourse:
 max_edits: 3
 time_budget_ms: 5000.0
 max_candidates_per_step: 32

fairness:
 suspect_threshold: 0.1

eval:
 n_explain_samples: 200
 n_recourse_samples: 200
 faithfulness_witnesses_per_sample: 5

logging:
 jsonl: true
 receipts: true
 hmac_env_var: CLAUSE86_HMAC_KEY
